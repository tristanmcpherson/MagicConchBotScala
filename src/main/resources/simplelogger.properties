# SLF4J Simple Logger Configuration

# Default log level for all loggers (trace, debug, info, warn, error)
org.slf4j.simpleLogger.defaultLogLevel=info

# Show date/time in logs
org.slf4j.simpleLogger.showDateTime=true

# Date/time format
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS

# Show thread name
org.slf4j.simpleLogger.showThreadName=true

# Show logger name (shortened)
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=false

# Optional: Set specific logger levels to reduce noise
# org.slf4j.simpleLogger.log.sttp.client4=info
# org.slf4j.simpleLogger.log.org.http4s=info

# Show all dev.raegous.magicconch logs at INFO level
org.slf4j.simpleLogger.log.dev.raegous.magicconch=info
